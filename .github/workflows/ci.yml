name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pyright

      - name: Run Ruff (lint)
        run: ruff check . --output-format=github

      - name: Run Ruff (format check)
        run: ruff format --check .

      - name: Run mypy (type check)
        run: mypy --ignore-missing-imports api crew tools rag evaluation governance safety review scripts || true

      - name: Run pyright (type check)
        run: pyright || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      chromadb:
        image: chromadb/chroma:1.5.9
        ports: ["8001:8000"]
        options: --health-cmd="curl -f http://localhost:8000/api/v2/heartbeat" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-asyncio pytest-mock

      - name: Prefetch embedding model
        run: python scripts/prefetch_models.py
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"

      - name: Run ingestion & indexing
        run: python rag/index.py

      - name: Start API server
        run: |
          export MOCK_LLM=true
          export CREWAI_DISABLE_TELEMETRY=true
          export OTEL_SDK_DISABLED=true
          export ADMIN_TOKEN=test-token
          export CHROMA_HOST=localhost
          export CHROMA_PORT=8001
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          sleep 10
          curl -f http://127.0.0.1:8000/health

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short -x --cov=. --cov-report=xml --cov-report=term-missing
        env:
          BACKEND_URL: http://127.0.0.1:8000

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint-and-type-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest-playwright

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Prefetch embedding model
        run: python scripts/prefetch_models.py
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"

      - name: Run ingestion & indexing
        run: python rag/index.py

      - name: Start API server
        run: |
          export MOCK_LLM=true
          export CREWAI_DISABLE_TELEMETRY=true
          export OTEL_SDK_DISABLED=true
          export ADMIN_TOKEN=test-token
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          sleep 15
          curl -f http://127.0.0.1:8000/health

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v --tb=short --headed=false
        env:
          BASE_URL: http://127.0.0.1:8000

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format=json --output=pip-audit.json || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, unit-tests, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          # Add your staging deployment commands here
          # e.g., kubectl set image, docker compose, etc.

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploy to production environment"
          # Add your production deployment commands here
          # Requires manual approval via environment protection rules