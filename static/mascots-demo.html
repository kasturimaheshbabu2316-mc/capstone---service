<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ola Support Intelligence — 3D Mascot Preview Suite</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' ws: wss:; script-src 'self' 'unsafe-inline';">
  <link rel="stylesheet" href="/static/css/tokens.css?v=32.0">
  <link rel="stylesheet" href="/static/css/base.css?v=32.0">
  <link rel="stylesheet" href="/static/css/components.css?v=32.0">
  <link rel="stylesheet" href="/static/css/mascots.css?v=32.0">
  <script>
    (function() {
      try {
        var p = new URLSearchParams(window.location.search);
        var t = p.get('theme') || localStorage.getItem('ola_theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <style>
    .demo-container {
      max-width: 960px;
      margin: 40px auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .demo-header {
      text-align: center;
    }
    .demo-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      color: var(--color-ink);
    }
    .demo-sub {
      color: var(--color-ink-secondary);
      font-size: 1rem;
    }
    .demo-controls-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      background: var(--glass-1-bg);
      border: 1px solid var(--glass-1-border);
      border-radius: var(--radius-panel);
      box-shadow: var(--glass-1-shadow);
      -webkit-backdrop-filter: var(--glass-1-blur);
      backdrop-filter: var(--glass-1-blur);
    }
    .demo-btn {
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: var(--color-ink);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    [data-theme="light"] .demo-btn {
      background: rgba(15, 23, 42, 0.06);
      border-color: rgba(15, 23, 42, 0.12);
    }
    .demo-btn:hover {
      background: rgba(0, 242, 254, 0.18);
      border-color: rgba(0, 242, 254, 0.40);
    }
    .demo-btn.active {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.35) 0%, rgba(16, 185, 129, 0.28) 100%);
      border-color: rgba(0, 242, 254, 0.55);
      box-shadow: 0 4px 14px rgba(0, 242, 254, 0.25);
    }
    .stage-card {
      width: 100%;
      max-width: 540px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--glass-2-bg);
      border: 1px solid var(--glass-2-border);
      border-radius: var(--radius-panel);
      box-shadow: var(--glass-2-shadow);
      -webkit-backdrop-filter: var(--glass-2-blur);
      backdrop-filter: var(--glass-2-blur);
    }
    .chips-preview {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 16px;
      padding: 16px 24px;
      background: var(--glass-1-bg);
      border: 1px solid var(--glass-1-border);
      border-radius: var(--radius-panel);
    }
    .chip-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--color-ink-secondary);
    }
  </style>
</head>
<body>

  <!-- Ambient Floating Glass Orbs Backdrop -->
  <div class="canvas-ambient-backdrop" aria-hidden="true">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>
    <div class="ambient-orb ambient-orb-4"></div>
  </div>

  <div class="demo-container">
    <div class="demo-header">
      <h1 class="demo-title">Live 3D AI Mascot System</h1>
      <p class="demo-sub">Interactive test harness for AI (Robot) and Sparky (Companion) character rigs</p>
    </div>

    <!-- Theme & State Controls -->
    <div class="demo-controls-panel">
      <button type="button" class="demo-btn" id="toggle-theme-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span>Toggle Theme (<span id="theme-name">Dark</span>)</span>
      </button>

      <button type="button" class="demo-btn" data-state="idle">Idle (Gentle Bob &amp; Blink)</button>
      <button type="button" class="demo-btn" data-state="thinking">Thinking (Holo Book &amp; Lens)</button>
      <button type="button" class="demo-btn" data-state="speaking">Speaking (Equalizer Visor)</button>
      <button type="button" class="demo-btn" data-state="success">Success (Thumbs Up &amp; Sparkles)</button>
      <button type="button" class="demo-btn" data-state="blocked">Blocked (Safety Stop Shield)</button>
      <button type="button" class="demo-btn active" data-state="wave">Wave (Empty State Greeting)</button>
    </div>

    <!-- Mascot 3D Stage Card -->
    <div class="stage-card">
      <div id="mascot-mount-point" style="width: 100%; display: flex; justify-content: center;"></div>
    </div>

    <!-- 52px Circular Glass Avatar Chips for Chat Rows -->
    <div class="chips-preview">
      <div class="chip-item">
        <div id="ai-chip-mount"></div>
        <span>AI Robot Avatar (52px)</span>
      </div>
      <div class="chip-item">
        <div id="sparky-chip-mount"></div>
        <span>Sparky Companion (52px)</span>
      </div>
    </div>
  </div>

  <script src="/static/js/mascots.js?v=32.0"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var mount = document.getElementById("mascot-mount-point");
      var aiMount = document.getElementById("ai-chip-mount");
      var sparkyMount = document.getElementById("sparky-chip-mount");

      if (typeof OlaMascots !== "undefined") {
        mount.innerHTML = OlaMascots.createMascotStage("wave", { isHero: true, speechBubble: true });
        aiMount.innerHTML = OlaMascots.createChatAvatarChip("ai");
        sparkyMount.innerHTML = OlaMascots.createChatAvatarChip("sparky");

        var stage = mount.querySelector(".mascot-stage");
        OlaMascots.attachPointerParallax(stage);

        // State buttons
        var buttons = document.querySelectorAll(".demo-controls-panel button[data-state]");
        buttons.forEach(function(btn) {
          btn.addEventListener("click", function() {
            buttons.forEach(function(b) { b.classList.remove("active"); });
            btn.classList.add("active");
            var st = btn.getAttribute("data-state");
            OlaMascots.setMascotState(stage, st);
          });
        });

        // Theme toggle button
        var themeBtn = document.getElementById("toggle-theme-btn");
        var themeName = document.getElementById("theme-name");
        themeBtn.addEventListener("click", function() {
          var current = document.documentElement.getAttribute("data-theme") || "dark";
          var next = current === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          themeName.textContent = next === "dark" ? "Dark" : "Light";
        });
      }
    });
  </script>
</body>
</html>
